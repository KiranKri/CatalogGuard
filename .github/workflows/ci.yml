name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (SQLite, stub LLM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Tests
        run: pytest -q

  postgres:
    name: Postgres 16
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catalogguard
          POSTGRES_PASSWORD: catalogguard
          POSTGRES_DB: catalogguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalogguard -d catalogguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://catalogguard:catalogguard@localhost:5432/catalogguard
        run: pytest -q

  compose:
    name: Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Walkthrough
        run: bash scripts/compose_smoke.sh
